<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Blogger Bot</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  font-family:Arial,sans-serif;
  background:#f2f4f7;
}

.box{
  max-width:700px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 3px 15px #ccc;
}

h1{
  text-align:center;
}

textarea{
  width:100%;
  min-height:180px;
  padding:15px;
  border-radius:10px;
  border:1px solid #bbb;
  font-size:17px;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 18px;
  margin:8px 4px 0 0;
  font-size:16px;
  color:white;
  cursor:pointer;
}

.send{
  background:#1976d2;
}

.voice{
  background:#7b1fa2;
}

.stop{
  background:#d32f2f;
}

.clear{
  background:#555;
}

#chat{
  margin-top:20px;
  padding:18px;
  background:#f7f7f7;
  border-radius:10px;
  min-height:150px;
  white-space:pre-wrap;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="box">

<h1>🤖 AI Blogger Bot</h1>

<p>Apna topic likhein:</p>

<textarea
id="message"
placeholder="Example: Online earning par ek article likho..."
></textarea>

<br>

<button class="send" onclick="sendMessage()">
💬 Generate
</button>

<button class="voice" onclick="speakAnswer()">
🔊 Female Voice
</button>

<button class="stop" onclick="stopVoice()">
⏹️ Stop
</button>
